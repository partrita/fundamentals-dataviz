[workspace]
authors = ["fkt <deepthought@postech.ac.kr>"]
channels = ["conda-forge"]
name = "mybook"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
install-deps = "Rscript -e 'remotes::install_github(\"clauswilke/colorblindr\"); remotes::install_github(\"clauswilke/dviz.supp\")'"
