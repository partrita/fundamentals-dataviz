r-gganimate = ">=1.0.11,<2"
r-transformr = ">=0.1.5,<1"
r-gifski = ">=1.32.0.2,<2"
r-png = ">=0.1.8,<1"
r-forcats = ">=1.0.1,<2"
r-lubridate = ">=1.9.5,<2"
r-mgcv = ">=1.9.4,<2"
r-tidyr = ">=1.3.2,<2"
r-purrr = ">=1.2.1,<2"
r-broom = ">=1.0.12,<2"
