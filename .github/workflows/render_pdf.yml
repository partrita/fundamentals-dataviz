name: Render Korean PDFs

on:
  workflow_dispatch:
  push:
     branches:
       - main
     paths:
       - 'mybook/**.qmd'
       - 'pixi.toml'
  
jobs:
  render_and_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.39.0
          manifest-path: pixi.toml

      - name: Install dviz.supp and colorblindr
        run: pixi run install-deps
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

      - name: Install TinyTeX
        run: pixi run quarto install tinytex

      - name: Render QMD to PDF and move to artifacts
        run: |
          mkdir -p artifacts
          for file in mybook/*.qmd; do
            # Render the QMD file. Quarto will by default place the PDF
            # in the same directory as the source QMD file.
            pixi run quarto render "$file" --to pdf || true
            
            # After rendering, move the generated PDF to the artifacts directory if it exists.
            if [ -f "${file%.qmd}.pdf" ]; then
              mv "${file%.qmd}.pdf" "artifacts/$(basename "${file%.qmd}").pdf"
            fi
          done

      - name: Create Release and Upload PDFs
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.pdf
          tag_name: korean-pdfs-${{ github.sha }}
          name: Korean Translated PDFs ${{ github.sha }}
          body: |
            Automated release of Korean translated PDF files.
            Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
