name: Build and Deploy Quarto Book

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.39.0
          manifest-path: pixi.toml
          locked: false

      - name: Cache Quarto Execution
        uses: actions/cache@v4
        with:
          path: |
            mybook/.quarto
            mybook/*_cache
          key: quarto-cache-${{ runner.os }}-${{ hashFiles('mybook/*.qmd') }}
          restore-keys: |
            quarto-cache-${{ runner.os }}-

      - name: Install R Dependencies
        run: pixi run install-deps
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

      - name: Render HTML Book
        run: pixi run quarto render mybook

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mybook/_book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
